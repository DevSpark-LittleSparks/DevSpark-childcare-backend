spring.profiles.active=local


# DevSpark ChildCare - Common Configuration
spring.application.name=childcare-backend
server.port=8080

# Database Configuration (Defaults)
spring.datasource.url=jdbc:mysql://localhost:3306/childcare_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root1234}

# JPA & Flyway
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# API Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT Configuration
app.jwt.secret=DevSparkChildCareManagementSystemSecretKey2026!
app.jwt.expiration-ms=3600000

# Mail Configuration (Defaults)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Firebase Configuration
app.firebase.config-path=src/main/resources/firebase-service-account.json

# Admin Notification Email
# This is the email address that receives notifications when new signup requests are submitted.
# Change this to the actual admin email address.
app.admin.email=${ADMIN_EMAIL:admin@devspark.com}

# Logging
logging.level.com.devspark=INFO
